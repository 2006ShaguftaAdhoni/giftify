
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - Giftify 🎁</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .order-card {
            margin: 20px 0;
            padding: 20px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .order-status {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
        }

        .tracking {
            display: flex;
            justify-content: space-between;
            gap: 5px;
            margin: 20px 0;
        }

        .tracking-step {
            text-align: center;
            flex: 1;
            font-size: 12px;
        }

        .tracking-circle {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ddd;
        }

        .tracking-step.active .tracking-circle {
            background: #8e44ad;
            color: white;
        }

        .tracking-step.active {
            font-weight: bold;
        }

        .order-product {
            padding: 10px;
            border-top: 1px solid #ddd;
        }
    </style>

</head>

<body>

<header>

    <h1>📦 My Orders</h1>

    <p>Track your Giftify orders</p>

</header>


<main>

    <div id="ordersContainer">

        <p>Loading your orders... ⏳</p>

    </div>

</main>


<nav>

    <a href="index.html">🏠 Home</a>

    <a href="index.html#searchInput">🔍 Search</a>

    <a href="wishlist.html">❤️ Wishlist</a>

    <a href="cart.html">🛒 Cart</a>

    <a href="orders.html">📦 My Orders</a>

</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

const ordersContainer =
    document.getElementById("ordersContainer");


const statusSteps = [

    {
        name: "Pending",
        emoji: "🛒"
    },

    {
        name: "Confirmed",
        emoji: "✅"
    },

    {
        name: "Preparing",
        emoji: "📦"
    },

    {
        name: "Out for Delivery",
        emoji: "🚚"
    },

    {
        name: "Delivered",
        emoji: "🎉"
    }

];


async function loadOrders() {

    const {
        data: { user },
        error: userError
    } =
        await supabaseClient.auth.getUser();


    if (userError || !user) {

        ordersContainer.innerHTML = `

            <div class="order-card">

                <h2>🔐 Login Required</h2>

                <p>
                    Please login to see your orders.
                </p>

                <button onclick="goBack()">
                    🏠 Go Home
                </button>

            </div>

        `;

        return;
    }


    const {
        data: orders,
        error
    } =
        await supabaseClient

            .from("orders")

            .select("*")

            .eq("customer_id", user.id)

            .order("created_at", {
                ascending: false
            });


    if (error) {

        console.error(error);

        ordersContainer.innerHTML = `

            <div class="order-card">

                <h2>❌ Could not load orders</h2>

                <p>
                    ${error.message}
                </p>

            </div>

        `;

        return;
    }


    if (!orders || orders.length === 0) {

        ordersContainer.innerHTML = `

            <div class="order-card">

                <h2>📦 No Orders Yet</h2>

                <p>
                    Your orders will appear here.
                </p>

                <a href="index.html">

                    <button>
                        🎁 Browse Gifts
                    </button>

                </a>

            </div>

        `;

        return;
    }


    ordersContainer.innerHTML = "";


    for (const order of orders) {

        await displayOrder(order);

    }

}


async function displayOrder(order) {

    const {
        data: items,
        error
    } =
        await supabaseClient

            .from("order_items")

            .select("*")

            .eq("order_id", order.id);


    if (error) {

        console.error(error);

        return;

    }


    const currentStatus =
        order.status || "Pending";


    let currentIndex =
        statusSteps.findIndex(
            step =>
                step.name === currentStatus
        );


    if (currentIndex === -1) {

        currentIndex = 0;

    }


    let trackingHTML = `

        <div class="tracking">

    `;


    statusSteps.forEach(
        (step, index) => {

            const active =
                index <= currentIndex
                    ? "active"
                    : "";

            trackingHTML += `

                <div class="tracking-step ${active}">

                    <div class="tracking-circle">

                        ${step.emoji}

                    </div>

                    <div>

                        ${step.name}

                    </div>

                </div>

            `;

        }
    );


    trackingHTML += `

        </div>

    `;


    let itemsHTML = "";


    if (items && items.length > 0) {

        items.forEach(item => {

            const quantity =
                item.quantity || 1;

            const price =
                Number(item.price || 0);


            itemsHTML += `

                <div class="order-product">

                    <strong>
                        🎁 ${item.product_name}
                    </strong>

                    <p>
                        ₹${price}
                        ×
                        ${quantity}
                    </p>

                </div>

            `;

        });

    }


    const orderDate =
        order.created_at
            ? new Date(order.created_at)
                .toLocaleString()
            : "Date unavailable";


    ordersContainer.innerHTML += `

        <div class="order-card">

            <h2>
                📦 Order #${order.id}
            </h2>

            <p>
                <strong>Order Date:</strong>
                ${orderDate}
            </p>

            <div class="order-status">

                Current Status:
                ${getStatusEmoji(currentStatus)}
                ${currentStatus}

            </div>

            ${trackingHTML}


            <hr>


            <h3>
                🎁 Ordered Gifts
            </h3>

            ${itemsHTML}


            <hr>


            <h3>
                💰 Total: ₹${order.total}
            </h3>

            <p>
                💵 Payment:
                Cash on Delivery
            </p>

            <p>
                📍 Delivery Address:
                ${order.address}
            </p>

            <p>
                📱 Phone:
                ${order.phone}
            </p>

        </div>

    `;

}


function getStatusEmoji(status) {

    const step =
        statusSteps.find(
            item =>
                item.name === status
        );

    return step
        ? step.emoji
        : "📦";

}


function goBack() {

    window.location.href =
        "index.html";

}


loadOrders();

</script>

</body>

</html>

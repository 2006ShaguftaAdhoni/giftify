
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giftify - My Orders</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Giftify 🎁</h1>
    <p>My Orders 📦</p>
</header>

<main>
    <h2>My Orders 📦</h2>

    <div id="ordersDisplay">
        <p>Loading your orders... ⏳</p>
    </div>
</main>

<nav>
    <a href="index.html">🏠 Home</a>
    <a href="index.html#searchInput">🔍 Search</a>
    <a href="wishlist.html">❤️ Wishlist</a>
    <a href="cart.html">🛒 Cart</a>
    <a href="orders.html">📦 My Orders</a>
</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

const ordersDisplay =
    document.getElementById("ordersDisplay");

const defaultImage =
    "https://images.unsplash.com/photo-1513883049090-d0b7439799bf?auto=format&fit=crop&w=600&q=80";


async function loadOrders() {

    // Check login
    const { data: userData, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !userData.user) {

        ordersDisplay.innerHTML = `
            <h3>Please login to see your orders 🔐</h3>
            <a href="seller-login.html">
                <button>Login</button>
            </a>
        `;

        return;
    }

    const user = userData.user;


    // Get customer's orders
    const { data: orders, error: ordersError } =
        await supabaseClient
            .from("orders")
            .select("*")
            .eq("customer_id", user.id)
            .order("created_at", { ascending: false });


    if (ordersError) {

        console.error(ordersError);

        ordersDisplay.innerHTML = `
            <p>Could not load orders.</p>
            <p>${ordersError.message}</p>
        `;

        return;
    }


    if (!orders || orders.length === 0) {

        ordersDisplay.innerHTML = `
            <h3>No orders yet 📦</h3>

            <p>
                Your placed orders will appear here.
            </p>

            <a href="index.html">
                <button>🎁 Browse Gifts</button>
            </a>
        `;

        return;
    }


    let allOrdersHTML = "";


    // Display every order
    for (const order of orders) {

        // Get products inside this order
        const { data: items, error: itemsError } =
            await supabaseClient
                .from("order_items")
                .select("*")
                .eq("order_id", order.id);


        if (itemsError) {
            console.error(itemsError);
            continue;
        }


        let productsHTML = "";


        for (const item of (items || [])) {

            let imageUrl = defaultImage;
            let description = "";
            let category = "Gift";


            // Get product information
            if (item.product_id) {

                const { data: product } =
                    await supabaseClient
                        .from("products")
                        .select("image_url, description, category")
                        .eq("id", item.product_id)
                        .maybeSingle();

                if (product) {

                    imageUrl =
                        product.image_url ||
                        defaultImage;

                    description =
                        product.description || "";

                    category =
                        product.category || "Gift";
                }
            }


            productsHTML += `
                <article class="product-card">

                    <img
                        src="${imageUrl}"
                        alt="${item.product_name}"
                        class="product-image"
                    >

                    <h3>
                        🎁 ${item.product_name}
                    </h3>

                    <p>
                        <strong>Price:</strong>
                        ₹${item.price}
                    </p>

                    <p>
                        ${description}
                    </p>

                    <p>
                        <strong>Category:</strong>
                        ${category}
                    </p>

                    <p>
                        <strong>Quantity:</strong>
                        ${item.quantity || 1}
                    </p>

                </article>
            `;
        }


        const orderDate =
            new Date(order.created_at).toLocaleString();


        allOrdersHTML += `
            <article>

                <h3>
                    📦 Order #${order.id} - Confirmed! 🎉
                </h3>

                <p>
                    <strong>Name:</strong>
                    ${order.customer_name}
                </p>

                <p>
                    <strong>Phone:</strong>
                    ${order.phone}
                </p>

                <p>
                    <strong>Delivery Address:</strong>
                    ${order.address}
                </p>

                <p>
                    <strong>Order Date:</strong>
                    ${orderDate}
                </p>

                <p>
                    <strong>Status:</strong>
                    ${order.status || "Pending"}
                </p>

                <h3>🎁 Products Ordered</h3>

                ${productsHTML}

                <h2>
                    💰 Total: ₹${order.total}
                </h2>

            </article>

            <hr>
        `;
    }


    ordersDisplay.innerHTML = allOrdersHTML;
}


loadOrders();

</script>

</body>
</html>

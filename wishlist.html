<!DOCTYPE html>
<html>
<head>
    <title>Giftify - Wishlist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Giftify 🎁</h1>
    <p>Your saved gifts ❤️</p>
</header>

<main>
    <h2>My Wishlist ❤️</h2>
    <div id="wishlistDisplay"></div>
</main>

<script>
    const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
    const wishlistDisplay = document.getElementById("wishlistDisplay");

    if (wishlist.length === 0) {
        wishlistDisplay.innerHTML =
            "<p>Your wishlist is empty ❤️</p>";
    } else {
        wishlist.forEach((product) => {
            wishlistDisplay.innerHTML += `
                <article>
                    <h3>🎁 ${product}</h3>
                    <p>Saved in your wishlist ❤️</p>
                </article>
            `;
        });
    }
</script>

</body>
</html>

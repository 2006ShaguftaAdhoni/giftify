
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Giftify 🎁</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <h1>🎁 Giftify</h1>

    <p>
        Find the perfect gift for every special moment ✨
    </p>

</header>


<main>


    <!-- ========================= -->
    <!-- GIFT SEARCH -->
    <!-- ========================= -->

    <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search for gifts..."
        onkeyup="searchProducts()"
    >


    <!-- ========================= -->
    <!-- LOCATION SEARCH -->
    <!-- ========================= -->

    <h2>📍 Find Gifts Near You</h2>

    <input
        type="text"
        id="locationInput"
        placeholder="📍 Enter your city or area..."
        onkeyup="filterByLocation()"
    >

    <button
        onclick="clearLocation()"
    >
        🌍 Show All Locations
    </button>


    <p id="locationMessage"></p>


    <!-- ========================= -->
    <!-- CATEGORIES -->
    <!-- ========================= -->

    <h2>Categories</h2>


    <div id="categoryButtons">

        <button
            onclick="filterCategory('All')"
        >
            All
        </button>


        <button
            onclick="filterCategory('Birthday')"
        >
            🎂 Birthday
        </button>


        <button
            onclick="filterCategory('Love')"
        >
            ❤️ Love
        </button>


        <button
            onclick="filterCategory('Graduation')"
        >
            🎓 Graduation
        </button>


        <button
            onclick="filterCategory('Anniversary')"
        >
            💍 Anniversary
        </button>


        <button
            onclick="filterCategory('For Her')"
        >
            🌸 For Her
        </button>


        <button
            onclick="filterCategory('For Him')"
        >
            🎁 For Him
        </button>

    </div>


    <!-- ========================= -->
    <!-- FEATURED GIFTS -->
    <!-- ========================= -->

    <h2>Featured Gifts</h2>


    <div id="productContainer"></div>


    <div id="cartDisplay"></div>


</main>


<!-- ========================= -->
<!-- SELLER -->
<!-- ========================= -->

<div
    style="
        text-align:center;
        margin:20px;
    "
>

    <a href="seller.html">

        <button>
            🏪 Sell Your Gifts
        </button>

    </a>

</div>


<!-- ========================= -->
<!-- BOTTOM NAVIGATION -->
<!-- ========================= -->

<nav>

    <a href="index.html">
        🏠 Home
    </a>


    <a href="index.html#searchInput">
        🔍 Search
    </a>


    <a href="wishlist.html">
        ❤️ Wishlist
    </a>


    <a href="cart.html">
        🛒 Cart
    </a>


    <a href="orders.html">
        📦 My Orders
    </a>

</nav>


<!-- ========================= -->
<!-- SCRIPTS -->
<!-- ========================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
    src="supabase.js"
></script>


<script
    src="products.js"
></script>


<script
    src="script.js"
></script>


</body>

</html>

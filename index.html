<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giftify 🎁</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎁 Giftify</h1>
        <p>Find something special for someone special</p>
    </header>

    <main>

        <input
            type="text"
            placeholder="🔍 Search for gifts..."
        >

        <h2>Categories</h2>

        <div>
            <button>🎂 Birthday</button>
            <button>💕 Love</button>
            <button>🎓 Graduation</button>
            <button>🎉 Anniversary</button>
            <button>👩 For Her</button>
            <button>👨 For Him</button>
        </div>

        <h2>Featured Gifts</h2>

        <div>
            <article>
                <div>🎁</div>
                <h3><a href="product.html">Custom Gift Box</a></h3>
                <p>₹499</p>
                <button>Add to Cart</button>
            </article>

            <article>
                <div>🌸</div>
                <h3><a href="product.html">Personalized Bouquet</a></h3>
                <p>₹699</p>
                <button>Add to Cart</button>
            </article>

            <article>
                <div>🧸</div>
                <h3><a href="product.html">Custom Teddy Gift</a></h3>
                <p>₹599</p>
                <button>Add to Cart</button>
            </article>
        </div>

    </main>

    <nav>
        <button>🏠 Home</button>
        <button>🔍 Search</button>
        <button>❤️ Wishlist</button>
        <button onclick="showCart()">🛒 Cart</button>
        <button>👤 Profile</button>
    </nav>
    <div id="cartDisplay"></div>
<script src="script.js"></script>
</body>
</html>

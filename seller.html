<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - Giftify 🎁</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏪 Giftify Seller</h1>
        <p>Grow your gift business</p>
    </header>

    <main>

        <h2>Seller Dashboard</h2>

        <section class="product-details">

            <h3>Add a New Gift</h3>

            <input id="giftName" type="text" placeholder="Gift name">

<input id="giftPrice" type="number" placeholder="Price">

<input id="giftCategory" type="text" placeholder="Category">

<input id="giftDescription" type="text" placeholder="Description">

<button onclick="addProduct()">Add Product 🎁</button>

        </section>

        <section class="product-details">

            <h3>Your Products</h3>

            <div id="productList">
    <p>No products added yet.</p>
</div>

        </section>

    </main>
    <script src="seller.js"></script>

</body>
</html>

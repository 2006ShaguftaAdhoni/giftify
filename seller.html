<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - Giftify 🎁</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🏪 Giftify Seller</h1>
    <p>Add and manage your gifts</p>
</header>

<main>

    <section class="product-details">

        <h2>Add a New Gift</h2>

        <input
            id="giftName"
            type="text"
            placeholder="Gift name"
        >

        <input
            id="giftPrice"
            type="number"
            placeholder="Price"
        >

        <input
            id="giftCategory"
            type="text"
            placeholder="Category"
        >

        <textarea
            id="giftDescription"
            placeholder="Description"
        ></textarea>

        <label for="giftImage">
            Select Product Photo
        </label>

        <input
            id="giftImage"
            type="file"
            accept="image/*"
        >

        <button onclick="addProduct()">
            Add Product 🎁
        </button>

    </section>

    <section class="product-details">

        <h2>Your Products</h2>

        <div id="productList">
            <p>Loading products...</p>
        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="seller.js"></script>

</body>
</html>

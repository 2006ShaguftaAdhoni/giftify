<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gift Details - Giftify 🎁</title>

<link rel="stylesheet" href="style.css">

</head><body><header>
    <h1>🎁 Giftify</h1>
    <p>Find something special for someone special</p>
</header><main><button onclick="history.back()">← Back</button>

<section
    class="product-details"
    id="productDetails"
></section>

</main><nav>
    <a href="index.html">🏠 Home</a>
    <a href="index.html#searchInput">🔍 Search</a>
    <a href="wishlist.html">❤️ Wishlist</a>
    <a href="cart.html">🛒 Cart</a>
    <a href="orders.html">📦 My Orders</a>
</nav><script src="products.js"></script><script>

const productId =
    new URLSearchParams(window.location.search)
    .get("id");


const sellerProducts =
    JSON.parse(
        localStorage.getItem("sellerProducts")
    ) || [];


const allProducts = [
    ...products,
    ...sellerProducts
];


const product =
    allProducts.find(
        (item) =>
            item.id == productId
    );


const productDetails =
    document.getElementById("productDetails");


if (!product) {

    productDetails.innerHTML = `

        <h2>Gift not found 😔</h2>

        <p>
            This gift could not be found.
        </p>

        <a href="index.html">
            <button>🏠 Back to Gifts</button>
        </a>

    `;

} else {

    productDetails.innerHTML = `

        <div class="product-image">
            ${product.emoji}
        </div>

        <h2>${product.name}</h2>

        <h3>₹${product.price}</h3>

        <p>
            ${product.description}
        </p>

        <p>
            <strong>Category:</strong>
            ${product.category}
        </p>

        <button onclick="addToCart()">
            🛒 Add to Cart
        </button>

        <button onclick="addToWishlist()">
            ❤️ Add to Wishlist
        </button>

    `;
}


// ADD TO CART
function addToCart() {

    let cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];


    cart.push(product);


    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    alert(
        product.name +
        " added to cart! 🛒"
    );
}


// ADD TO WISHLIST
function addToWishlist() {

    let wishlist =
        JSON.parse(
            localStorage.getItem("wishlist")
        ) || [];


    const exists =
        wishlist.some(
            (item) =>
                item.name === product.name
        );


    if (exists) {

        alert(
            product.name +
            " is already in your wishlist ❤️"
        );

        return;
    }


    wishlist.push(product);


    localStorage.setItem(
        "wishlist",
        JSON.stringify(wishlist)
    );


    alert(
        product.name +
        " added to wishlist! ❤️"
    );
}

</script></body>
</html>

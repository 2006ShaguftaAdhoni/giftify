
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gift Details - Giftify 🎁</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <h1>🎁 Giftify</h1>

    <p>
        Find something special for someone special
    </p>

</header>


<main>

    <button onclick="history.back()">
        ← Back
    </button>


    <section
        class="product-details"
        id="productDetails"
    >

        <p>
            Loading gift... ⏳
        </p>

    </section>

</main>


<nav>

    <a href="index.html">
        🏠 Home
    </a>

    <a href="index.html#searchInput">
        🔍 Search
    </a>

    <a href="wishlist.html">
        ❤️ Wishlist
    </a>

    <a href="cart.html">
        🛒 Cart
    </a>

    <a href="orders.html">
        📦 My Orders
    </a>

</nav>


<!-- SUPABASE -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="supabase.js"></script>

<script src="products.js"></script>


<script>


// ==========================================
// GET PRODUCT ID
// ==========================================

const productId =
    new URLSearchParams(
        window.location.search
    ).get("id");


const productDetails =
    document.getElementById(
        "productDetails"
    );


// ==========================================
// LOAD PRODUCT
// ==========================================

async function loadProduct() {

    // --------------------------------------
    // DEFAULT GIFT
    // --------------------------------------

    if (
        productId &&
        productId.startsWith("default-")
    ) {

        const defaultId =
            productId.replace(
                "default-",
                ""
            );


        const product =
            products.find(
                item =>
                    String(item.id) ===
                    String(defaultId)
            );


        if (product) {

            displayProduct(product);

        } else {

            showNotFound();
        }


        return;
    }


    // --------------------------------------
    // SELLER PRODUCT
    // --------------------------------------

    if (
        productId &&
        productId.startsWith("seller-")
    ) {

        const sellerId =
            productId.replace(
                "seller-",
                ""
            );


        const {
            data: product,
            error
        } =
            await supabaseClient
                .from("products")
                .select("*")
                .eq(
                    "id",
                    sellerId
                )
                .maybeSingle();


        if (error) {

            console.error(error);

            productDetails.innerHTML = `

                <h2>
                    Could not load gift 😔
                </h2>

                <p>
                    ${error.message}
                </p>

            `;

            return;
        }


        if (!product) {

            showNotFound();

            return;
        }


        displayProduct(product);

        return;
    }


    showNotFound();
}


// ==========================================
// DISPLAY PRODUCT
// ==========================================

function displayProduct(product) {

    const imageUrl =
        product.image_url ||
        product.image ||
        "";


    const imageHTML =
        imageUrl

        ?

        `
        <img
            src="${imageUrl}"
            alt="${product.name}"
            class="product-image"
            style="
                width:100%;
                max-height:350px;
                object-fit:cover;
                border-radius:12px;
            "
        >
        `

        :

        `
        <div
            style="
                font-size:80px;
                text-align:center;
                padding:30px;
            "
        >
            ${product.emoji || "🎁"}
        </div>
        `;


    productDetails.innerHTML = `

        ${imageHTML}


        <h2>
            ${product.emoji || "🎁"}
            ${product.name}
        </h2>


        <h3>
            ₹${product.price}
        </h3>


        <p>
            ${product.description || ""}
        </p>


        <p>
            <strong>
                Category:
            </strong>

            ${product.category || "Gift"}
        </p>


        <hr>


        <!-- SELLER INFORMATION -->

        <h3>
            🏪 Seller Information
        </h3>


        <p>

            <strong>
                Business:
            </strong>

            ${
                product.business_name ||
                "Giftify Seller"
            }

        </p>


        <p>

            📍
            <strong>
                Location:
            </strong>

            ${
                product.seller_location ||
                "Location not provided"
            }

        </p>


        ${
            product.seller_id

            ?

            `
            <button
                onclick="
                    viewSellerProfile(
                        '${product.seller_id}'
                    )
                "
            >
                🏪 View Seller
            </button>
            `

            :

            ""
        }


        <br><br>


        <button
            onclick="addToCart()"
        >
            🛒 Add to Cart
        </button>


        <button
            onclick="addToWishlist()"
        >
            ❤️ Add to Wishlist
        </button>

    `;


    // Save current product
    window.currentProduct =
        product;
}


// ==========================================
// VIEW SELLER PROFILE
// ==========================================

function viewSellerProfile(
    sellerId
) {

    window.location.href =
        "seller-profile.html?id=" +
        encodeURIComponent(
            sellerId
        );
}


// ==========================================
// NOT FOUND
// ==========================================

function showNotFound() {

    productDetails.innerHTML = `

        <h2>
            Gift not found 😔
        </h2>

        <p>
            This gift could not be found.
        </p>


        <a href="index.html">

            <button>
                🏠 Back to Gifts
            </button>

        </a>

    `;
}


// ==========================================
// ADD TO CART
// ==========================================

function addToCart() {

    const product =
        window.currentProduct;


    if (!product) {

        alert(
            "Product not found!"
        );

        return;
    }


    let cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];


    // Give the product the same unique ID
    // used by the homepage

    const cartProduct = {

        ...product,

        uniqueId:
            product.seller_id

            ?

            "seller-" +
            product.id

            :

            "default-" +
            product.id
    };


    cart.push(
        cartProduct
    );


    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    alert(
        product.name +
        " added to cart! 🛒"
    );
}


// ==========================================
// ADD TO WISHLIST
// ==========================================

function addToWishlist() {

    const product =
        window.currentProduct;


    if (!product) {

        alert(
            "Product not found!"
        );

        return;
    }


    let wishlist =
        JSON.parse(
            localStorage.getItem("wishlist")
        ) || [];


    const uniqueId =
        product.seller_id

        ?

        "seller-" +
        product.id

        :

        "default-" +
        product.id;


    const exists =
        wishlist.some(
            item =>
                item.uniqueId ===
                uniqueId
        );


    if (exists) {

        alert(
            product.name +
            " is already in your wishlist ❤️"
        );

        return;
    }


    wishlist.push({

        ...product,

        uniqueId:
            uniqueId

    });


    localStorage.setItem(
        "wishlist",
        JSON.stringify(wishlist)
    );


    alert(
        product.name +
        " added to wishlist! ❤️"
    );
}


// ==========================================
// START
// ==========================================

loadProduct();

</script>


</body>

</html>

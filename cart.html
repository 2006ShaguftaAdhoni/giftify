<!DOCTYPE html>
<html>
<head>
    <title>Giftify - Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Giftify 🎁</h1>
    <p>Your shopping cart 🛒</p>
</header>

<main>
    <h2>My Cart 🛒</h2>
    <div id="cartDisplay"></div>
<button onclick="checkout()">🛍️ Proceed to Checkout</button>

<div id="checkoutForm" style="display: none;">
    <h2>Delivery Details</h2>

    <input id="customerName" placeholder="Your name">
    <input id="customerPhone" placeholder="Phone number">
    <textarea id="customerAddress" placeholder="Delivery address"></textarea>

    <button onclick="placeOrder()">Place Order 🎉</button>
</div>

</main>

<script>
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    const cartDisplay = document.getElementById("cartDisplay");

    if (cart.length === 0) {
        cartDisplay.innerHTML = "<p>Your cart is empty 🛒</p>";
    } else {
        cart.forEach((product) => {
            cartDisplay.innerHTML += `
                <article>
    <h3>🎁 ${product}</h3>
    <p>Added to your cart 🛒</p>
    <button onclick="removeFromCart('${product}')">
        🗑️ Remove
    </button>
</article>
            `;
        });
    }
    function removeFromCart(product) {
    const index = cart.indexOf(product);

    if (index !== -1) {
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        location.reload();
    }
    }
    function checkout() {
    if (cart.length === 0) {
        alert("Your cart is empty 🛒");
        return;
    }

    document.getElementById("checkoutForm").style.display = "block";
}

function placeOrder() {
    const name = document.getElementById("customerName").value;
    const phone = document.getElementById("customerPhone").value;
    const address = document.getElementById("customerAddress").value;

    if (!name || !phone || !address) {
        alert("Please fill all details!");
        return;
    }

    
alert("Thank you, " + name + "! Your order has been placed successfully! 🎉");
    localStorage.removeItem("cart");
    location.reload();
}
</script>

</body>
</html>

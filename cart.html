
       
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Giftify 🎁</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🛒 Your Cart</h1>
    <p>Review your gifts before ordering</p>
</header>

<main>

    <div id="cartDisplay">
        <p>Loading cart...</p>
    </div>

    <div id="checkoutSection" style="display:none;">

        <hr>

        <h2>📦 Delivery Details</h2>

        <input
            type="text"
            id="customerName"
            placeholder="👤 Full Name"
        >

        <input
            type="tel"
            id="customerPhone"
            placeholder="📱 Phone Number"
        >

        <textarea
            id="customerAddress"
            placeholder="📍 Full Delivery Address"
            rows="4"
        ></textarea>

        <h2>💳 Payment Method</h2>

        <label>
            <input
                type="radio"
                name="paymentMethod"
                value="Cash on Delivery"
                checked
            >
            💵 Cash on Delivery
        </label>

        <br><br>

        <button onclick="placeOrder()">
            ✅ Place Order
        </button>

    </div>

</main>

<nav>
    <a href="index.html">🏠 Home</a>
    <a href="index.html#searchInput">🔍 Search</a>
    <a href="wishlist.html">❤️ Wishlist</a>
    <a href="cart.html">🛒 Cart</a>
    <a href="orders.html">📦 My Orders</a>
</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

let cart =
    JSON.parse(localStorage.getItem("cart")) || [];

const cartDisplay =
    document.getElementById("cartDisplay");

const checkoutSection =
    document.getElementById("checkoutSection");


// DISPLAY CART
function displayCart() {

    cartDisplay.innerHTML = "";

    if (cart.length === 0) {

        cartDisplay.innerHTML = `
            <h2>🛒 Your cart is empty</h2>

            <p>Add some gifts to your cart first.</p>

            <a href="index.html">
                <button>🎁 Browse Gifts</button>
            </a>
        `;

        checkoutSection.style.display = "none";

        return;
    }

    let total = 0;

    cart.forEach((product, index) => {

        const price =
            Number(product.price || 0);

        total += price;

        const image =
            product.image_url ||
            product.image ||
            "https://images.unsplash.com/photo-1513883049090-d0b7439799bf?auto=format&fit=crop&w=600&q=80";

        cartDisplay.innerHTML += `

            <article>

                <img
                    src="${image}"
                    alt="${product.name}"
                    class="product-image"
                >

                <h3>
                    ${product.emoji || "🎁"}
                    ${product.name}
                </h3>

                <p class="price">
                    ₹${price}
                </p>

                <p>
                    ${product.description || ""}
                </p>

                <p>
                    🏪
                    ${product.business_name || "Giftify Seller"}
                </p>

                <p>
                    📍
                    ${product.seller_location || "Location not provided"}
                </p>

                <button onclick="removeFromCart(${index})">
                    ❌ Remove
                </button>

            </article>

        `;
    });


    cartDisplay.innerHTML += `

        <hr>

        <h2>
            💰 Total: ₹${total}
        </h2>

        <button onclick="showCheckout()">
            🛍️ Proceed to Checkout
        </button>

    `;

    checkoutSection.style.display = "none";
}


// REMOVE PRODUCT
function removeFromCart(index) {

    cart.splice(index, 1);

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    displayCart();
}


// SHOW CHECKOUT
function showCheckout() {

    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    checkoutSection.style.display = "block";

    checkoutSection.scrollIntoView({
        behavior: "smooth"
    });
}
